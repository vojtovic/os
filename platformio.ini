; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove_esp32_s3_wroom

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-DCORE_DEBUG_LEVEL=3
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps = 
	olikraus/U8g2@^2.36.18
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BusIO@^1.16.1
	jackjansen/esp32_idf5_https_server@^1.1.1
lib_ignore =
	esp32_https_server
	esp32_idf5_https_server_compat
	fhessel/esp32_https_server@1.0.0
	jackjansen/esp32_idf5_https_server_compat@1.1.1
